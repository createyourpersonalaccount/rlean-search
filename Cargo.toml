[package]
name = "rlean-search"
version = "0.1.0"
edition = "2021"
description = "Type-aware search over Lean 4 theorems, lemmas, and axioms"
license = "MIT"
authors = [
        "Nikolaos Chatzikonstantinou <nchatz314@gmail.com>",
        "Grok Build (built by xAI)"
        ]
readme = "README.md"
repository = "https://github.com/createyourpersonalaccount/rlean-search"

[[bin]]
name = "rlean-search"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
indexmap = "2"
bytes = "1"
futures = "0.3"
dashmap = "6"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
