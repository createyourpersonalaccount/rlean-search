name: Publish AsciiDoc

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Asciidoctor and Pygments
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor ruby
          gem install --user-install pygments.rb

      - name: Build documentation
        run: |
          mkdir -p _site
          asciidoctor -o _site/index.html README.adoc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

